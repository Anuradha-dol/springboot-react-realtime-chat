spring.application.name=chatapp-backend
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/chat_app
# Keep local defaults, but allow secure env overrides.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.jwt.cookie-name=chatapp_token
app.jwt.refresh-cookie-name=chatapp_refresh_token
app.jwt.secret=${JWT_SECRET:replace-this-with-a-secure-key-at-least-32-bytes-for-dev-123456}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.upload.base-dir=uploads
app.upload.max-image-size-bytes=5242880
app.upload.max-video-size-bytes=26214400
app.frontend.origin-patterns=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173

# Mail credentials must come from environment variables.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# OTP behavior for email verification and password reset.
app.auth.otp.length=6
app.auth.otp.expiry-minutes=10
app.auth.otp.resend-cooldown-seconds=60
app.auth.otp.max-resends=5
